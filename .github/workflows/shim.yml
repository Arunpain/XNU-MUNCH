name: Build Boot Shim

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shim/**"
      - "dtb/**"
      - "tools/**"
      - ".github/workflows/shim.yml"

jobs:
  build-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 git
          # Install official AOSP mkbootimg (Ubuntu apt mkbootimg package is broken without gki)
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg-aosp
          sudo cp /tmp/mkbootimg-aosp/mkbootimg.py /usr/local/bin/mkbootimg
          sudo cp -r /tmp/mkbootimg-aosp/gki /usr/local/bin/
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg --help

      - name: Download XNU Kernel Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p xnu/out
          # Download latest successful xnu-kernel artifact from the repo
          gh run download -n xnu-kernel -D xnu/out -R ${{ github.repository }} || true
          ls -la xnu/out/

      - name: Build Munch ADT & Payload
        run: |
          mkdir -p shim/out
          python3 tools/mkadt.py shim/out/munch.adt --highmem
          if [ -f xnu/out/kernel.development.sweet ]; then
            python3 tools/mkpayload.py xnu/out/kernel.development.sweet shim/out/munch.adt shim/out/payload.bin \
              --cmdline 'debug=0xc serial=3 cpus=8 keepsyms=1 -enable_kprintf_spam -noprogress rd=ufsroot0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 sweetfb_noconsole=1 sweetfb_hz=30'
            ls -la shim/out/payload.bin
          else
            echo "warning: xnu/out/kernel.development.sweet not found, building standalone diagnostic shim"
          fi

      - name: Compile Shim & Assemble Boot Image
        working-directory: shim
        run: |
          if [ -f out/payload.bin ]; then
            bash build.sh ../shim/out/payload.bin
          else
            bash build.sh
          fi
          ls -la out/shim-boot.img

      - name: Upload shim-boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-boot-img
          path: shim/out/shim-boot.img
